<nav class="flex items-center gap-3 p-4">
  @for (route of routes; track route.path) {
    <a
      [routerLink]="route.path"
      routerLinkActive="active-link"
      class="rounded-md px-4 py-2 text-sm font-medium text-stone-600 uppercase transition-all duration-200 hover:bg-stone-50/50 hover:text-sky-600 dark:text-stone-400 dark:hover:bg-stone-50/5 dark:hover:text-stone-50"
    >
      {{ route.title }}
    </a>
  }
</nav>
