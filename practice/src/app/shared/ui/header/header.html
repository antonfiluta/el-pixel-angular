<nav class="flex items-center gap-3 p-4">
  @for (route of routes; track route.path) {
  <a [routerLink]="route.path" routerLinkActive="active-link"
    class="uppercase text-stone-600 hover:text-sky-600 dark:text-stone-400 dark:hover:text-stone-50 px-4 py-2 rounded-md text-sm font-medium transition-all duration-200 hover:bg-stone-50/50 dark:hover:bg-stone-50/5">
    {{ route.title }}
  </a>
  }
</nav>
